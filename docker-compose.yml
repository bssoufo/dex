services:
  dex:
    image: ghcr.io/${GITHUB_REPOSITORY:-spaparts/dex}:latest
    restart: always
    ports:
      - "${PORT:-8000}:${PORT:-8000}"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - ENVIRONMENT=production
      - PORT=${PORT:-8000}
      - ALLOWED_ORIGIN=${ALLOWED_ORIGIN:-*}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:${PORT:-8000}/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
