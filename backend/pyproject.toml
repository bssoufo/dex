[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.79.0",
    "beautifulsoup4>=4.14.3",
    "fastapi>=0.115",
    "fastmcp>=2.14,<3",
    "google-genai>=1.63.0",
    "httpx>=0.28.1",
    "instructor>=1.14.5",
    "langchain-google-genai>=4.2,<5",
    "langchain-mcp-adapters>=0.2.1",
    "langgraph>=1.0.8",
    "langgraph-supervisor>=0.0.31",
    "lxml>=6.0.2",
    "pdfplumber>=0.11.9",
    "pydantic>=2.12.5",
    "python-dotenv>=1.2.1",
    "rich>=14.3.2",
    "tenacity>=9.1.4",
    "uvicorn>=0.34",
]

[dependency-groups]
dev = [
    "jsonschema>=4.26.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-timeout>=2.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: tests that call real Gemini API and MCP subprocess",
]
